[package]
name = "keel-splice"
version = "0.0.0"
edition = "2024"
description = "Bootstrap a repo from versioned template pieces and keep it current"
license = "MIT"
publish = false

[lib]
name = "splice"
path = "src/lib.rs"

[[bin]]
name = "splice"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[dev-dependencies]
assert_cmd = "2.2"
serde_json = { version = "1", features = ["preserve_order"] }
