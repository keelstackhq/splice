[package]
name = "keel-splice"
version = "0.1.0"
edition = "2024"
description = "Bootstrap a repo from versioned template pieces and keep it current"
license = "MIT"

[lib]
name = "splice"
path = "src/lib.rs"

[[bin]]
name = "splice"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
semver = "1"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "1.1"
regex = "1"
globset = "0.4"
indexmap = { version = "2", features = ["serde"] }
walkdir = "2.5"
minijinja = "~2.24"
toml_edit = "0.25"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
insta = { version = "1.49", features = ["json", "yaml"] }
